<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanod Dashboard — Barangay 179</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="tanod.css">
</head>
<body class="tanod-body">

    <header class="tanod-topbar">
        <div class="tanod-brand">
            <i class="fa-solid fa-shield-halved"></i>
            <span>Barangay 179 — Tanod Portal</span>
        </div>
        <button id="logoutBtn" class="tanod-btn tanod-btn-ghost">
            <i class="fa-solid fa-right-from-bracket"></i> Logout
        </button>
    </header>

    <main class="tanod-main">

        <!-- Profile Card -->
        <section class="tanod-card" id="profileCard">
            <div class="tanod-card-header">
                <i class="fa-solid fa-id-badge"></i>
                <h2>My Profile</h2>
            </div>
            <div class="tanod-profile-grid">
                <div>
                    <span class="tanod-label">Name</span>
                    <p id="profileName" class="tanod-value">—</p>
                </div>
                <div>
                    <span class="tanod-label">Position</span>
                    <p id="profilePosition" class="tanod-value">—</p>
                </div>
                <div>
                    <span class="tanod-label">Assigned Area</span>
                    <p id="profileArea" class="tanod-value">—</p>
                </div>
                <div>
                    <span class="tanod-label">Shift Schedule</span>
                    <p id="profileShift" class="tanod-value">—</p>
                </div>
            </div>
        </section>

        <!-- My Patrol Schedule -->
        <section class="tanod-card" id="scheduleCard">
            <div class="tanod-card-header">
                <i class="fa-solid fa-calendar-days"></i>
                <h2>My Patrol Schedule</h2>
            </div>
            <div id="scheduleList" class="tanod-list">
                <p class="tanod-empty">Loading...</p>
            </div>
        </section>

        <!-- Report Incident -->
        <section class="tanod-card" id="reportCard">
            <div class="tanod-card-header">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <h2>Report Incident</h2>
            </div>
            <form id="incidentReportForm" class="tanod-form">
                <div class="tanod-form-group">
                    <label for="reportType">Incident Type</label>
                    <select id="reportType" class="tanod-input" required>
                        <option value="" disabled selected>Select Incident Type</option>
                        <optgroup label="Violent Crimes">
                            <option value="Homicide">Homicide</option>
                            <option value="Attempted Murder">Attempted Murder</option>
                            <option value="Kidnapping">Kidnapping</option>
                            <option value="Child Abuse">Child Abuse</option>
                            <option value="VAWC">VAWC (Violence Against Women and Children)</option>
                            <option value="Illegal Release of Fire Arms">Illegal Release of Fire Arms</option>
                            <option value="Attempted Arson">Attempted Arson</option>
                            <option value="Robbery">Robbery</option>
                            <option value="Grave Threat">Grave Threat</option>
                            <option value="Act of Lasciviousness">Act of Lasciviousness</option>
                            <option value="Physical Injury">Physical Injury</option>
                            <option value="Threats">Threats</option>
                            <option value="Less Serious Physical Injuries">Less Serious Physical Injuries</option>
                            <option value="Falsification of Documents">Falsification of Documents</option>
                            <option value="Slight Physical Injuries and Maltreatment">Slight Physical Injuries and Maltreatment</option>
                            <option value="Light Threats">Light Threats</option>
                        </optgroup>
                        <optgroup label="Property Crimes">
                            <option value="Arson">Arson</option>
                            <option value="Theft">Theft</option>
                            <option value="Fencing of Stolen Properties">Fencing of Stolen Properties</option>
                            <option value="Qualified Trespass to Dwelling">Qualified Trespass to Dwelling</option>
                            <option value="Occupation of Real Property or Usurpation of">Occupation of Real Property or Usurpation of</option>
                            <option value="Removal, Sale or Pledge of Mortgaged Property">Removal, Sale or Pledge of Mortgaged Property</option>
                            <option value="Trespassing">Trespassing</option>
                            <option value="Altering Boundaries of Landmarks">Altering Boundaries of Landmarks</option>
                            <option value="Vandalism">Vandalism</option>
                        </optgroup>
                        <optgroup label="Financial / Fraud Crimes">
                            <option value="Scam">Scam</option>
                            <option value="Swindling of Estafa">Swindling of Estafa</option>
                            <option value="Estafa">Estafa</option>
                            <option value="Cybercrime Prevention Act 2012 (RA 10175)">Cybercrime Prevention Act 2012 (RA 10175)</option>
                            <option value="Estafa/Debts">Estafa/Debts</option>
                            <option value="Cyber Bullying">Cyber Bullying</option>
                        </optgroup>
                        <optgroup label="Social / Public Order Crimes">
                            <option value="Voyeurism Act">Voyeurism Act</option>
                            <option value="Alarms and Scandals">Alarms and Scandals</option>
                            <option value="Incriminating Innocent Persons">Incriminating Innocent Persons</option>
                            <option value="Threatening to Publish and offer to prevent">Threatening to Publish and offer to prevent</option>
                            <option value="Oral Defamation">Oral Defamation</option>
                            <option value="Harassment">Harassment</option>
                            <option value="Intriguing Against Honor">Intriguing Against Honor</option>
                            <option value="Unlawful Use of Means of Publication and Unlaw">Unlawful Use of Means of Publication and Unlawful Utterances</option>
                            <option value="Prohibiting Publication of Acts Referred to in the">Prohibiting Publication of Acts Referred to in the Proceedings</option>
                        </optgroup>
                        <optgroup label="Special / Child-Related">
                            <option value="BCPC">BCPC (Barangay Council for the Protection of Children)</option>
                            <option value="Child Support">Child Support</option>
                        </optgroup>
                        <optgroup label="Other Incidents">
                            <option value="Hit and Run">Hit and Run</option>
                            <option value="Reckless Impudence Resulting to Damage to Property and Physical Injury">Reckless Impudence Resulting to Damage to Property and Physical Injury</option>
                            <option value="Reckless Impudence Resulting Physical Injury">Reckless Impudence Resulting Physical Injury</option>
                            <option value="Noise Complaint">Noise Complaint</option>
                            <option value="Anti Electricity Pilferage">Anti Electricity Pilferage</option>
                            <option value="Reckless Impudence Resulting to Damage to Property">Reckless Impudence Resulting to Damage to Property</option>
                            <option value="Safe Special Act">Safe Special Act</option>
                            <option value="Bastos Law">Bastos Law</option>
                            <option value="Abandoning a Minor">Abandoning a Minor</option>
                            <option value="Abandonment of a Person in Danger">Abandonment of a Person in Danger</option>
                            <option value="Inducing a Minor to Abandon His/her Home">Inducing a Minor to Abandon His/her Home</option>
                            <option value="Animal Welfare Acts">Animal Welfare Acts</option>
                            <option value="Suspicious Activity">Suspicious Activity</option>
                            <option value="Traffic Obstruction">Traffic Obstruction</option>
                            <option value="Breach of Contract">Breach of Contract</option>
                            <option value="Breach Contact">Breach Contact</option>
                            <option value="Curfew Violation">Curfew Violation</option>
                            <option value="Abandon">Abandon</option>
                            <option value="Missing">Missing</option>
                            <option value="Suicide">Suicide</option>
                        </optgroup>
                    </select>
                </div>

                <div class="tanod-form-row">
                    <div class="tanod-form-group">
                        <label for="reportDate">Date</label>
                        <input type="date" id="reportDate" class="tanod-input" required>
                    </div>
                    <div class="tanod-form-group">
                        <label for="reportTime">Time</label>
                        <input type="time" id="reportTime" class="tanod-input" required>
                    </div>
                </div>

                <div class="tanod-form-group">
                    <label>Location</label>
                    <p id="reportLocation" class="tanod-value tanod-readonly-field">—</p>
                </div>

                <div class="tanod-form-group">
                    <label for="reportDescription">Description</label>
                    <textarea id="reportDescription" class="tanod-input" rows="3" placeholder="Describe what happened..."></textarea>
                </div>

                <button type="submit" class="tanod-btn tanod-btn-primary tanod-btn-block">
                    <i class="fa-solid fa-paper-plane"></i> Submit Report
                </button>
                <p id="reportStatus" class="tanod-form-status"></p>
            </form>
        </section>

        <!-- Recent Incidents in My Area -->
        <section class="tanod-card" id="areaIncidentsCard">
            <div class="tanod-card-header">
                <i class="fa-solid fa-map-location-dot"></i>
                <h2>Recent Incidents in My Area</h2>
            </div>
            <div id="areaIncidentsList" class="tanod-list">
                <p class="tanod-empty">Loading...</p>
            </div>
        </section>

        <!-- My Patrol Logs -->
        <section class="tanod-card" id="logsCard">
            <div class="tanod-card-header">
                <i class="fa-solid fa-clipboard-list"></i>
                <h2>My Patrol Logs</h2>
            </div>

            <form id="patrolLogForm" class="tanod-form">
                <div class="tanod-form-group">
                    <label for="logSchedule">Patrol Schedule</label>
                    <select id="logSchedule" class="tanod-input" required>
                        <option value="" disabled selected>Select a schedule</option>
                    </select>
                </div>
                <div class="tanod-form-row">
                    <div class="tanod-form-group">
                        <label for="logDate">Date</label>
                        <input type="date" id="logDate" class="tanod-input" required>
                    </div>
                    <div class="tanod-form-group">
                        <label for="logStatus">Status</label>
                        <select id="logStatus" class="tanod-input">
                            <option value="Completed">Completed</option>
                            <option value="Partial">Partial</option>
                            <option value="Failed">Failed</option>
                        </select>
                    </div>
                </div>
                <div class="tanod-form-group">
                    <label for="logReport">Report Notes</label>
                    <textarea id="logReport" class="tanod-input" rows="2" placeholder="What happened during this patrol?"></textarea>
                </div>
                <button type="submit" class="tanod-btn tanod-btn-primary tanod-btn-block">
                    <i class="fa-solid fa-plus"></i> Add Patrol Log
                </button>
                <p id="logStatusMsg" class="tanod-form-status"></p>
            </form>

            <div id="logsList" class="tanod-list">
                <p class="tanod-empty">Loading...</p>
            </div>
        </section>

    </main>

    <script src="tanod.js"></script>
</body>
</html>
